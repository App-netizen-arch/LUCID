name: lucid_app
description: Gestalt-MVP Neuro-Symbolic Gesture Recognition Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  provider: ^6.1.1
  
  # Camera for hand tracking
  camera: ^0.10.5
  
  # FFI bridge to Rust
  flutter_rust_bridge: ^2.0.0
  
  # MediaPipe Hands (via platform channel)
  # Note: For MVP, use pre-built MediaPipe Tasks Vision library
  
  # UI utilities
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  # Code generation for flutter_rust_bridge
  flutter_rust_bridge_generator: ^2.0.0
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/models/
  
  # Platform-specific configurations
  # Android: Minimum API 21, target API 33
  # iOS: Minimum iOS 12.0
