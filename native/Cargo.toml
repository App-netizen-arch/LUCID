[package]
name = "gestalt_core"
version = "0.1.0"
edition = "2021"
description = "Neuro-symbolic gesture recognition core for Gestalt-MVP"
license = "MIT"

[lib]
name = "gestalt_core"
crate-type = ["staticlib", "cdylib"]

[dependencies]
flutter_rust_bridge = "=2.0.0"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
sha3 = "0.10"

[build-dependencies]
flutter_rust_bridge = "=2.0.0"
cbindgen = "0.26"

[profile.release]
opt-level = 3
lto = true
